<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>羅盤地圖疊加工具 v2</title>    
    
    <!-- 引入與原版一致的 Google 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet" />
    
    <!-- Leaflet 地圖樣式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f4eee1; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部導航欄 (1:1 還原卡其與紅磚色調) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #faf6ee;
            border-bottom: 1px solid #e1d7c1;
            z-index: 1000;
        }
        .logo-area {
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            color: #8a1c14;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-area {
            display: flex;
            align-items: center;
            width: 35%;
            max-width: 400px;
        }
        .search-area input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #c8bba6;
            border-radius: 4px 0 0 4px;
            background-color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .search-area button {
            padding: 8px 16px;
            background-color: #8a1c14;
            color: white;
            border: 1px solid #8a1c14;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-area button:hover { background-color: #a1231b; }

        /* 地圖主容器 */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #f4eee1;
        }

        /* 畫面中央固定十字對齊線 */
        .center-cross-v {
            position: absolute; top: 0; left: 50%; width: 1px; height: 100%;
            background: rgba(138, 28, 20, 0.5); z-index: 9; pointer-events: none;
        }
        .center-cross-h {
            position: absolute; top: 50%; left: 0; width: 100%; height: 1px;
            background: rgba(138, 28, 20, 0.5); z-index: 9; pointer-events: none;
        }
        /* 中心小圓圈輔助對齊 */
        .center-dot {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 1px solid rgba(138, 28, 20, 0.6); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 9; pointer-events: none;
        }

        /* 畫面中央固定羅盤層 */
        #luopan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 580px; /* 放大羅盤尺寸 */
            height: 580px;
            transform: translate(-50%, -50%) rotate(0deg);
            pointer-events: none; /* 穿透點擊底層地圖 */
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.1s ease;
        }
        #luopan-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 右側控制面板 (1:1 還原截圖外觀) */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 290px;
            background-color: #faf6ee;
            border: 1px solid #e1d7c1;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(40, 30, 15, 0.1.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-section h3 {
            font-size: 14px;
            font-weight: 700;
            color: #4a3b2c;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #e1d7c1;
            padding-bottom: 6px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #5a4c3d;
        }
        
        /* 磚紅按鈕 */
        .btn-toggle {
            padding: 5px 14px;
            background-color: #8a1c14;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-toggle.off {
            background-color: #a09586;
        }

        /* 下拉選單 */
        .map-select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #c8bba6;
            border-radius: 6px;
            background-color: white;
            font-size: 13px;
            color: #4a3b2c;
            outline: none;
        }

        /* 滑動條美化 */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-container input[type=range] {
            width: 100%;
            accent-color: #8a1c14;
            cursor: pointer;
        }

        /* 按鈕網格 */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-action {
            padding: 10px;
            background-color: #ffffff;
            border: 1px solid #c8bba6;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #4a3b2c;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-action:hover {
            background-color: #f4eee1;
            border-color: #a89a85;
        }
        .btn-action.active {
            background-color: #8a1c14;
            color: white;
            border-color: #8a1c14;
        }

        /* 底部深色提示欄 */
        .tip-box {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background-color: rgba(40, 35, 30, 0.85);
            color: #f5f0e6;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- 頂部導航欄 -->
    <header>
        <div class="logo-area">
            🧭 羅盤地圖疊加工具
        </div>
        <div class="search-area">
            <input type="text" id="search-input" placeholder="輸入地址搜尋..." />
            <button onclick="searchAddress()">🔍</button>
        </div>
    </header>

    <!-- 地圖與疊加主區 -->
    <div id="map-container">
        <!-- Leaflet 地圖 -->
        <div id="map"></div>
        
        <!-- 精準紅色十字對齊線與中心點 -->
        <div class="center-cross-v"></div>
        <div class="center-cross-h"></div>
        <div class="center-dot"></div>

        <!-- 畫面正中央固定羅盤（已換成你上傳的 compass.png） -->
        <div id="luopan-overlay">
            <img src="compass.png" id="luopan-img" alt="羅盤圖片未讀取 (請確保 compass.png 與此檔案放同一資料夾)" />
        </div>

        <!-- 右側整合式控制面板 -->
        <div class="control-panel">
            <!-- 羅盤控制 -->
            <div class="panel-section">
                <h3>🧭 羅盤控制</h3>
                <div class="control-row">
                    <span>顯示羅盤</span>
                    <button class="btn-toggle" id="toggle-luopan" onclick="toggleLuopan()">已開啟</button>
                </div>
                <div class="slider-container">
                    <div class="control-row"><span>透明度</span><span id="opacity-val">60%</span></div>
                    <input type="range" id="slider-opacity" min="0" max="100" value="60" oninput="updateLuopan()">
                </div>
                <div class="slider-container">
                    <div class="control-row"><span>旋轉角度</span><span id="angle-val">0°</span></div>
                    <input type="range" id="slider-angle" min="0" max="359" value="0" oninput="updateLuopan()">
                </div>
            </div>

            <!-- 地圖型態與放大功能 -->
            <div class="panel-section">
                <h3>🗺️ 地圖操作</h3>
                <div class="control-row">
                    <span>地圖樣式</span>
                    <select id="map-layer-select" class="map-select" onchange="switchLayer()">
                        <option value="google-hybrid">Google 衛星混合圖 (超清晰)</option>
                        <option value="google-roadmap">Google 標準地圖</option>
                        <option value="osm">OpenStreetMap 傳統地圖</option>
                    </select>
                </div>
                <div class="btn-grid">
                    <button class="btn-action" onclick="mapZoom(1)">🔍 放大地圖</button>
                    <button class="btn-action" onclick="mapZoom(-1)">🔍 縮小地圖</button>
                    <button class="btn-action" id="btn-draw" onclick="toggleDrawing()">✏️ 開始畫線</button>
                    <button class="btn-action" onclick="clearLines()">🗑️ 清除畫線</button>
                </div>
            </div>
        </div>

        <!-- 底部提示 -->
        <div class="tip-box">
            提示：已載入 Google 高清地圖，支援極限深度放大。請將 compass.png 與此檔案放在同一個資料夾內。
        </div>
    </div>

    <!-- 引入 Leaflet 地圖核心 JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. 定義多種地圖源（特別加入 Google Maps 以支援超深度放大）
        // ==========================================
        const layers = {
            'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }),
            'google-roadmap': L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 22, // Google 地圖支援極限放大到 22 級
                maxNativeZoom: 20
            }),
            'google-hybrid': L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                maxZoom: 22, // 衛星混合圖，睇建築物屋脊方向最清楚
                maxNativeZoom: 20
            })
        };

        // 初始化地圖（預設使用 Google 衛星混合圖，並設定 maxZoom 為 22）
        const map = L.map('map', {
            zoomControl: false, 
            attributionControl: false,
            layers: [layers['google-hybrid']],
            maxZoom: 22
        }).setView([22.3193, 114.1694], 16); // 預設定位香港，初始放大級數提高

        // 切換地圖圖層
        function switchLayer() {
            const selected = document.getElementById('map-layer-select').value;
            for (let key in layers) {
                map.removeLayer(layers[key]);
            }
            layers[selected].addTo(map);
        }

        // ==========================================
        // 2. 羅盤滑塊與圖片控制
        // ==========================================
        let isLuopanShow = true;
        const luopanOverlay = document.getElementById('luopan-overlay');
        const btnToggle = document.getElementById('toggle-luopan');
        
        function toggleLuopan() {
            isLuopanShow = !isLuopanShow;
            if(isLuopanShow) {
                luopanOverlay.style.display = 'block';
                btnToggle.innerText = '已開啟';
                btnToggle.classList.remove('off');
            } else {
                luopanOverlay.style.display = 'none';
                btnToggle.innerText = '已關閉';
                btnToggle.classList.add('off');
            }
        }

        function updateLuopan() {
            const opacity = document.getElementById('slider-opacity').value;
            const angle = document.getElementById('slider-angle').value;
            
            document.getElementById('opacity-val').innerText = opacity + '%';
            document.getElementById('angle-val').innerText = angle + '°';
            
            luopanOverlay.style.opacity = opacity / 100;
            // 完美保持置中並套用旋轉角度
            luopanOverlay.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }
        
        // 初始化一次數值
        updateLuopan();

        // ==========================================
        // 3. 地圖精準放大縮小與免 Key 搜尋
        // ==========================================
        function mapZoom(delta) {
            if(delta > 0) map.zoomIn();
            else map.zoomOut();
        }

        async function searchAddress() {
            const query = document.getElementById('search-input').value;
            if(!query) return;
            
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if(data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.setView([lat, lon], 19); // 搜尋後直接深度放大
                } else {
                    alert('找不到該地址，請嘗試其他地名或大廈名！');
                }
            } catch (error) {
                alert('搜尋伺服器繁忙，請稍候再試！');
            }
        }
        
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAddress();
        });

        // ==========================================
        // 4. 地圖流暢滑鼠/觸控畫線功能
        // ==========================================
        let isDrawing = false;
        let drawnLines = [];
        let currentLine = null;

        function toggleDrawing() {
            isDrawing = !isDrawing;
            const btn = document.getElementById('btn-draw');
            if(isDrawing) {
                btn.innerText = '🛑 停止畫線';
                btn.classList.add('active');
                map.dragging.disable(); // 畫線時鎖定底層地圖防位移
                map.on('mousedown', startLine);
            } else {
                btn.innerText = '✏️ 開始畫線';
                btn.classList.remove('active');
                map.dragging.enable();  // 恢復地圖拖拽
                map.off('mousedown', startLine);
                map.off('mousemove', moveLine);
                map.off('mouseup', endLine);
                currentLine = null;
            }
        }

        function startLine(e) {
            currentLine = L.polyline([e.latlng, e.latlng], {
                color: '#8a1c14', 
                weight: 3,
                opacity: 0.9
            }).addTo(map);
            map.on('mousemove', moveLine);
            map.on('mouseup', endLine);
        }

        function moveLine(e) {
            if (currentLine) {
                const latlngs = currentLine.getLatLngs();
                latlngs[1] = e.latlng;
                currentLine.setLatLngs(latlngs);
            }
        }

        function endLine() {
            if (currentLine) {
                drawnLines.push(currentLine);
            }
            map.off('mousemove', moveLine);
            map.off('mouseup', endLine);
            currentLine = null;
        }

        function clearLines() {
            drawnLines.forEach(line => map.removeLayer(line));
            drawnLines = [];
            if(currentLine) {
                map.removeLayer(currentLine);
                currentLine = null;
            }
        }
    </script>
</body>
</html>
