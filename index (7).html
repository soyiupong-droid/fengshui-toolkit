<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#781f1f" />
    <meta name="description" content="風水工具箱：羅盤地圖、擇日與奇門導航。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>風水工具箱</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        --ink: #2d211c;
        --muted: #735f54;
        --paper: #fbf6ea;
        --surface: rgba(255, 252, 244, 0.91);
        --red: #781f1f;
        --red-light: #a83d32;
        --gold: #bd8532;
        --line: rgba(120, 31, 31, 0.16);
        background: var(--paper);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #e9d7b6;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 0%, rgba(189, 133, 50, 0.2), transparent 35%),
          radial-gradient(circle at 100% 25%, rgba(120, 31, 31, 0.12), transparent 32%),
          linear-gradient(160deg, #fffaf0 0%, #f3e7cf 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.4;
        background-image:
          linear-gradient(30deg, transparent 48%, rgba(120, 31, 31, 0.035) 49%, transparent 51%),
          linear-gradient(150deg, transparent 48%, rgba(120, 31, 31, 0.035) 49%, transparent 51%);
        background-size: 42px 72px;
      }

      .shell {
        position: relative;
        width: min(100%, 1080px);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding:
          max(28px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
      }

      .mark {
        display: grid;
        flex: 0 0 auto;
        width: 64px;
        height: 64px;
        place-items: center;
        border: 1px solid rgba(189, 133, 50, 0.5);
        border-radius: 50%;
        color: #fff8e6;
        font-family: "Noto Serif TC", serif;
        font-size: 30px;
        font-weight: 700;
        background: var(--red);
        box-shadow: 0 8px 24px rgba(70, 31, 17, 0.2);
      }

      h1 {
        margin: 0;
        color: var(--red);
        font-family: "Noto Serif TC", serif;
        font-size: clamp(27px, 7vw, 42px);
        line-height: 1.15;
        letter-spacing: 0.05em;
      }

      .intro {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .card {
        position: relative;
        display: flex;
        min-height: 200px;
        flex-direction: column;
        overflow: hidden;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 22px;
        color: inherit;
        text-decoration: none;
        background: var(--surface);
        box-shadow: 0 10px 34px rgba(69, 42, 26, 0.09);
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          border-color 160ms ease;
      }

      .card::after {
        position: absolute;
        right: -30px;
        bottom: -42px;
        width: 135px;
        height: 135px;
        border: 1px solid rgba(120, 31, 31, 0.08);
        border-radius: 50%;
        content: "";
        box-shadow:
          0 0 0 15px rgba(120, 31, 31, 0.025),
          0 0 0 31px rgba(189, 133, 50, 0.025);
      }

      .card:active {
        transform: scale(0.985);
      }

      .card:focus-visible {
        outline: 3px solid rgba(189, 133, 50, 0.7);
        outline-offset: 3px;
      }

      .symbol {
        display: grid;
        width: 48px;
        height: 48px;
        margin-bottom: 24px;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        font-family: "Noto Serif TC", serif;
        font-size: 23px;
        font-weight: 700;
        background: linear-gradient(145deg, var(--red-light), var(--red));
      }

      .card h2 {
        margin: 0;
        color: var(--red);
        font-size: 21px;
      }

      .card p {
        max-width: 34em;
        margin: 8px 0 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .launch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: auto;
        color: var(--red);
        font-size: 14px;
        font-weight: 700;
      }

      .launch span {
        transition: transform 160ms ease;
      }

      .card:hover {
        border-color: rgba(120, 31, 31, 0.35);
        box-shadow: 0 14px 38px rgba(69, 42, 26, 0.14);
        transform: translateY(-2px);
      }

      .card:hover .launch span {
        transform: translateX(3px);
      }

      footer {
        margin-top: 26px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 640px) {
        .shell {
          padding-top: max(20px, env(safe-area-inset-top));
        }

        header {
          gap: 12px;
          margin-bottom: 20px;
        }

        .mark {
          width: 54px;
          height: 54px;
          font-size: 25px;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 13px;
        }

        .card {
          min-height: 154px;
          padding: 18px;
        }

        .symbol {
          width: 42px;
          height: 42px;
          margin-bottom: 15px;
          border-radius: 12px;
          font-size: 20px;
        }

        .card p {
          margin: 5px 0 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .launch span {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark" aria-hidden="true">易</div>
        <div>
          <h1>風水工具箱</h1>
          <p class="intro">羅盤、擇日、奇門，一站開啟</p>
        </div>
      </header>

      <section class="grid" aria-label="工具列表">
        <a class="card" href="./apps/compass-map/">
          <div class="symbol" aria-hidden="true">盤</div>
          <h2>羅盤地圖</h2>
          <p>在地圖上疊加羅盤，支援定位、旋轉、透明度及畫線。</p>
          <div class="launch">開啟工具 <span aria-hidden="true">→</span></div>
        </a>

        <a class="card" href="./apps/luckyday/">
          <div class="symbol" aria-hidden="true">日</div>
          <h2>擇日小幫手</h2>
          <p>按干支、建星、二十八宿及農曆條件快速篩選日子。</p>
          <div class="launch">開啟工具 <span aria-hidden="true">→</span></div>
        </a>

        <a class="card" href="./apps/luckyday-2/">
          <div class="symbol" aria-hidden="true">曆</div>
          <h2>奇門通勝</h2>
          <p>月曆、每日資料、時辰九宮及進階擇日功能。</p>
          <div class="launch">開啟工具 <span aria-hidden="true">→</span></div>
        </a>

        <a class="card" href="./apps/qimen-navigator/">
          <div class="symbol" aria-hidden="true">奇</div>
          <h2>奇門導航</h2>
          <p>時家奇門九宮排盤，配合地圖尋找合適方位。</p>
          <div class="launch">開啟工具 <span aria-hidden="true">→</span></div>
        </a>
      </section>

      <footer>各工具保持獨立運作，方便日後逐步升級。</footer>
    </main>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
